name: Validate Pinshu Skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install verified visual-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libpng-dev libjpeg-dev libfreetype6-dev fonts-noto-cjk libreoffice-impress poppler-utils
          curl --fail --location https://github.com/ImageMagick/ImageMagick/archive/ad98b244c995d2e3051757fa3b7855f45b550d24.tar.gz --output "$RUNNER_TEMP/imagemagick.tar.gz"
          tar -xzf "$RUNNER_TEMP/imagemagick.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ImageMagick-ad98b244c995d2e3051757fa3b7855f45b550d24"
          ./configure --without-perl --disable-openmp
          make -j2
          sudo make install
          sudo ldconfig
          magick -version
          curl --fail --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
          python3 -m pip install --quiet python-pptx==1.0.2
      - name: Validate release bundle
        run: python3 scripts/validate_release.py
      - name: Learning-asset validator self-test
        run: python3 pinshu-course/tests/self_test_validate_learning_assets.py
      - name: Runtime-contract self-test
        run: python3 pinshu-course/tests/self_test_runtime_contracts.py
      - name: Content-assets route self-test
        run: python3 -m unittest discover -s pinshu-content-assets/tests -v
      - name: Film-teardown offline self-test
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python3 -m pip install --quiet numpy soundfile pillow
          python3 pinshu-film-teardown/tests/self_test.py
      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
        with:
          chrome-version: stable
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Markdown converter security tests
        run: |
          python3 -m pip install --quiet markdown2 markdown-it-py
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          command -v pdftotext
          command -v pdfinfo
          python3 -m unittest discover -s pinshu-md2pdf/tests -v
      - name: Public visual-system regression
        run: python3 -m unittest discover -s pinshu-visual-system/tests -v
      - name: Public visual-companion regression
        run: python3 -m unittest tests/test_visual_companions.py -v
      - name: Independent visual-review regressions
        run: python3 -m unittest tests/test_visual_review_regressions.py -v
      - name: Real native PPTX rendering
        run: python3 -m unittest tests/test_native_pptx_render.py -v
      - name: Installer negative controls
        run: bash tests/test_installer.sh
      - name: Shell syntax
        run: bash -n install.sh
