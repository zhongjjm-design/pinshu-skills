interface:
  display_name: "Pinshu Knowledge Distillation"
  short_description: "Create structured guides and cross-course syntheses"
  default_prompt: "Use $pinshu-distill to turn the corrected source into a well-prioritized, coherent, standalone study guide. Create a formal cross-course topic synthesis only when the required lessons are available. Keep source identity separate from verification status; do not present the result as a faithful transcript, generate learning drills, or append publication assets by default."
