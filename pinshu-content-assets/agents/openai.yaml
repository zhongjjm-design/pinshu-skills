interface:
  display_name: "Pinshu Content Assets"
  short_description: "Build traceable sourcebooks from edited sessions"
  default_prompt: "Use $pinshu-content-assets to make a reusable content sourcebook from this course, livestream, or interview. Read the corrected faithful transcript and structured guide first; use the correction dictionary for names and the raw transcript only for quote or conflict checks. Explain the through-line, then cover valuable claims, methods, cases, figures, memorable lines, questions and supported publication angles from every section, with source notes. Make each entry understandable without replaying the event, mark missing costs or outcomes nearby, distinguish old demos shown live from work made live and deployed work, and do not turn an STT mistake into a visible quote. A complete course also needs a cross-lesson sourcebook linked to lesson detail. Do not draft an article by default. Keep the asset pending review and unavailable as approved writing input until I approve it."
