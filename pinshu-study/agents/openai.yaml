interface:
  display_name: "Pinshu Study Coach"
  short_description: "Create enabled review materials; coach and record real study"
  default_prompt: "Use $pinshu-study for this course's enabled learning goal. Prepare distinct recall cards and training questions with separate JSON indices; do not create personal records before actual study. If I have not studied, guide me instead of testing. Once I answer, ask one question at a time, diagnose omissions against the notes and faithful transcript, seek a fresh answer, and preserve the original answer in a readable Markdown record."
