interface:
  display_name: "Pinshu Transcript"
  short_description: "Faithfully edit transcripts and retain reproducible details"
  default_prompt: "Use $pinshu-transcript to faithfully edit the provided transcript: correct STT errors and speech noise, own and update the course glossary from the first lesson, and preserve the speaker's identity, views, examples, numbers, constraints, procedures, prompts, code, and uncertainty in source order. Keep edited quotations distinct from verbatim ones; do not turn the main text into a summary."
