interface:
  display_name: "Pinshu Writing"
  short_description: "Grow an author's seed into a plain, reviewed Chinese article"
  default_prompt: "Use $pinshu-write to write an article for the configured account. Read the account profile first; it is the authority. Start from the author's seed: confirm it, number its points, and keep its direction as the anchor. The normal stops are the four approval points (seed, judgment, title and outline, final draft), each in the fixed approval-message shape; also stop when the seed's core is overturned, when an opinion piece lacks the author's own material, or after two rejections in a row. Pass the judgment gate before approval 2 and the skeleton gate before approval 3. The author's named writer writes; a wording editor from another vendor checks item by item, keeps what passes and proposes a replacement line only where a named standard fails. Review-chain reviewers flag only. Run the editor-in-chief review before approval 4; close each article with feedback candidates. Keep facts sourced, never invent the author's experience, and run scripts/audit_draft.py before every review."
