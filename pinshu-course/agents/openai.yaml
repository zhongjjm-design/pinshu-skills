interface:
  display_name: "Pinshu Course"
  short_description: "Orchestrate core course results and optional extensions"
  default_prompt: "Use $pinshu-course to confirm course identity, purpose, write root, and current lesson. Preserve the immutable raw transcript, create a faithful edit and structured notes, and update one course-map entry. Enable $pinshu-study review materials for a learning-purpose course; create records only after real study. If content reuse is requested, use $pinshu-content-assets to create one pending-review sourcebook per lesson and a course-level sourcebook; do not auto-write an article. Trigger independent QA for risk or adaptive sampling, not every ordinary lesson."
