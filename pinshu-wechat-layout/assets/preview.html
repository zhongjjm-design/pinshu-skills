<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品叔六款排版 · 公开试用版</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeee8;color:#292a26;font-family:-apple-system,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #c8c9be;border-radius:5px;background:#fff;color:#292a26;padding:8px 12px}button:hover{border-color:#565a4d}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #947957;outline-offset:3px}.primary{background:#292e28;color:#fff;border-color:#292e28}.topbar{position:sticky;top:0;z-index:5;background:#eeeee8f5;border-bottom:1px solid #d3d5c8;padding:12px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center}.topbar h1{margin:0;font-size:17px;font-weight:600}.topbar p{margin:4px 0 0;font-size:12px;color:#727668}.buttons{display:flex;gap:7px;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:300px 375px;justify-content:center;gap:40px;padding:28px 18px}.sidebar{font-size:13px;line-height:1.7}.sidebar h2{font-size:14px;margin:22px 0 10px}.sidebar h2:first-child{margin-top:0}select,input[type=text]{width:100%;min-height:44px;padding:9px;background:#fff;border:1px solid #c8c9be;border-radius:5px;color:#292a26}.templates{display:grid;gap:8px}.template{text-align:left;padding:12px 13px;min-height:76px}.template.selected{border:1px solid #525846;box-shadow:inset 0 0 0 1px #525846}.template strong{font-size:15px;display:block}.template small{font-size:11px;color:#76786b;display:block;margin-top:4px}.template .swatch{display:inline-block;width:9px;height:9px;margin-right:7px}.template .number{font:11px Georgia,serif;color:#929583;margin-right:9px}.muted{font-size:12px;color:#787b70;line-height:1.75}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls label{font-size:11px;color:#777c70}.controls select{font-size:12px}.paper{width:375px;background:#fff;box-shadow:0 8px 30px #00000008;align-self:start}.paper header{padding:25px 22px 0}.paper header h1{font-size:25px;line-height:1.4;letter-spacing:0;margin:0 0 12px}.paper header p{font-size:13px;color:#8b8b81;margin:0 0 25px}#article-body{padding:0 36px 24px;background:#fff;overflow-wrap:break-word}#article-body img{max-width:100%}.field{margin:13px 0}.field label{font-size:11px;color:#7a7e72;display:block;margin-bottom:5px}.field button{min-height:32px;font-size:12px;padding:4px 8px;margin-top:6px}.field p{margin:4px 0 5px}.cover{display:block;width:100%;margin:12px 0 6px}.sidebar a{color:#655640}.status{font-size:12px;line-height:1.7;min-height:25px;color:#56624d;margin:12px 0}details{margin-top:18px}summary{cursor:pointer;min-height:32px}.footer{max-width:754px;margin:12px auto 32px;padding:0 18px;font-size:12px;line-height:1.8;color:#74786b}.compare{position:fixed;inset:0;z-index:8;background:#edeee6;overflow:auto;padding:18px}.compare[hidden]{display:none}.compare-head{position:sticky;top:-18px;padding:13px 0;background:#edeee6f7;z-index:2;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}.compare-head h2{font-size:17px;margin:0 0 7px}.stages{display:flex;gap:7px;flex-wrap:wrap}.stages button{font-size:12px;min-height:36px}.comparison-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1740px;margin:12px auto}.comparison-card{padding:13px;border:1px solid #d5d7ca;background:#f7f7f1}.comparison-card h3{font-size:15px;margin:0}.comparison-card p.description{font-size:11px;color:#767a6c;line-height:1.7;margin:6px 0 12px}.comparison-card button{width:100%;margin:10px 0 0;font-size:12px}.comparison-scroll{height:720px;overflow:auto;background:#fff}.comparison-body{padding:16px;background:#fff;overflow-wrap:break-word}#upload-files{font-size:12px;width:100%;margin-top:9px}.hint{padding:11px;background:#e7e9de;font-size:12px;color:#66705d;line-height:1.7}.clear{background:transparent;border-color:#c8c9be}.reference{margin-top:7px;font-size:11px;line-height:1.65;color:#818477}
@media(max-width:800px){.topbar{padding:9px 12px;flex-wrap:wrap}.topbar h1{font-size:15px}.topbar p{display:none}.buttons button{font-size:12px;padding:8px}.workspace{display:flex;flex-direction:column;padding:20px 0;gap:22px}.sidebar{width:min(414px,100%);padding:0 16px;align-self:center}.templates{grid-template-columns:1fr 1fr}.template{padding:10px;min-height:91px}.template strong{font-size:14px}.paper{width:min(375px,100%);align-self:center;order:-1}.paper header{padding:22px 16px 0}#article-body{padding:0 36px 20px}.comparison-grid{grid-template-columns:1fr}.compare{padding:10px}.compare-head{top:-10px}.comparison-card{padding:10px}.comparison-scroll{height:670px}.topbar .buttons{width:100%}input[type=text]{font-size:16px}}

.ref-grid{display:grid;grid-template-columns:375px 375px;justify-content:center;gap:28px;margin:20px auto}.ref-grid h3{font-size:14px;margin:0 0 12px;font-weight:500}.ref-grid a{color:#565d4c}.ref-scroll{height:1000px;overflow:auto;background:#fff}.ref-scroll>img{display:block;width:375px;max-width:100%;height:auto}.compare-note{max-width:778px;margin:16px auto;color:#6b7163;font-size:13px;line-height:1.7}#sample-reference{padding:0 16px 20px;background:#fff}@media(max-width:850px){.ref-grid{grid-template-columns:min(375px,100%);gap:25px}.ref-scroll{height:800px}.compare-note{font-size:12px}}
</style></head><body>
<div class="topbar"><div><h1>品叔六款排版 · 公开试用版</h1><p>六款同级版式，共同阅读基座；逐篇选择和审稿</p></div><div class="buttons"><button id="copy-body" class="primary">复制正文和配图</button><button id="export-body">下载排版正文</button></div></div>
<main class="workspace"><aside class="sidebar"><h2>选择文章</h2><select id="article-select" aria-label="选择文章"></select><h2>选择版式</h2><div class="templates" id="template-list"></div><h2 id="theme-name"></h2><p id="theme-desc"></p><p class="reference" id="theme-origin"></p><div class="controls"><label>阅读节奏<select id="rhythm"><option value="long">长文 · 连续阅读</option><option value="short">短篇 · 紧凑编排</option></select></label><label>图片呈现<select id="framing"><option value="yes">保留模板衬框</option><option value="no">原图直出</option></select></label></div><p class="muted">六款版式可切换。头图（封面图）放在标题下、正文第一段前，随正文一起复制；封面原图另在侧栏下载。正文共用阅读基座并保留原稿分段。</p><label class="muted">预览配色<select id="preview-mode" aria-label="预览配色"><option value="light">浅色预览</option><option value="dark">深色近似预览</option></select></label><div id="status" class="status" role="status" aria-live="polite"></div>
<h2>发布信息</h2><div class="field"><label for="meta-title">标题</label><input id="meta-title" type="text"><button id="copy-title">复制标题</button></div><div class="field"><label for="meta-author">作者（按账号填写）</label><input id="meta-author" type="text"><button id="copy-author">复制作者</button></div><div class="field"><label for="meta-digest">摘要</label><input id="meta-digest" type="text"><button id="copy-digest">复制摘要</button></div><h2>原封面</h2><img class="cover" id="cover-image" alt="横封面"><a id="cover-download" download>下载横封面</a><details><summary>方封面</summary><img class="cover" id="square-image" alt="方封面"><a id="square-download" download>下载方封面</a></details><p class="muted">标题、作者、摘要单独填写；封面在后台单独上传。右侧标题与作者模拟公众号显示，不进入复制正文。</p>

</aside><div class="paper" id="paper"><header><h1 id="preview-title"></h1><p id="preview-author"></p></header><article id="article-body"></article></div></main>
<p class="footer">公开试用版 v0.4.0-rc.1 · 六款同级可选。本文稿与配图仅完成本地试排；微信手机预览和发布均待人工确认。</p>
<script>
const C=@@CONFIG@@;
@@RENDERER@@
let ai=0,ti=0,previewMode='light';const body=document.getElementById('article-body'),status=document.getElementById('status'),articleSelect=document.getElementById('article-select');
const params=new URLSearchParams(location.search);ai=Math.max(0,C.articles.findIndex(a=>a.id===params.get('article')));ti=Math.max(0,themes.findIndex(t=>t.id===params.get('template')));
function options(){return {compact:document.getElementById('rhythm').value==='short',framing:document.getElementById('framing').value!=='no'};}
function populate(){articleSelect.replaceChildren();for(const a of C.articles){const o=document.createElement('option');o.value=a.id;o.textContent=a.title;articleSelect.append(o);}articleSelect.value=C.articles[ai].id;}
function setTheme(id){ti=themes.findIndex(t=>t.id===id);apply();}
for(let i=0;i<themes.length;i++){const t=themes[i],btn=document.createElement('button');btn.className='template';btn.dataset.template=t.id;btn.innerHTML='<strong><span class="number">'+String(i+1).padStart(2,'0')+'</span><span class="swatch" style="background:'+t.accent+'"></span>'+t.name+'</strong><small>'+t.scene+'</small>';btn.onclick=()=>setTheme(t.id);document.getElementById('template-list').append(btn);}
function apply(){
 const a=C.articles[ai],t=themes[ti],dark=previewMode==='dark';body.innerHTML=render(a,t,options());if(dark)nightPreview(body);
 document.getElementById('paper').style.background=dark?'#191919':'#fff';body.style.background=dark?'#191919':'#fff';
 document.getElementById('preview-title').style.color=dark?'#d2d2ce':'#292a26';document.getElementById('preview-author').style.color=dark?'#888b90':'#8b8b81';
 document.getElementById('preview-title').textContent=a.title;document.getElementById('preview-author').textContent=a.author;
 for(const id of ['title','author','digest'])document.getElementById('meta-'+id).value=a[id]||'';
 document.getElementById('theme-name').textContent=t.name;document.getElementById('theme-desc').textContent=t.desc;document.getElementById('theme-origin').textContent=t.origin;
 for(const b of document.querySelectorAll('.template'))b.classList.toggle('selected',b.dataset.template===t.id);
 for(const [key,imgId,linkId,label]of [['cover','cover-image','cover-download','横封面'],['square','square-image','square-download','方封面']]){const im=document.getElementById(imgId),aTag=document.getElementById(linkId);im.src=a[key]||'';im.hidden=!a[key];aTag.hidden=!a[key];aTag.href=a[key]||'';aTag.download=a.title+'-'+label+(String(a[key]).startsWith('data:image/jpeg')?'.jpg':'.png');}
 status.textContent='';
}
articleSelect.onchange=()=>{ai=C.articles.findIndex(a=>a.id===articleSelect.value);apply();};
for(const id of ['title','author','digest'])document.getElementById('meta-'+id).oninput=e=>{C.articles[ai][id]=e.target.value;if(id!=='digest')document.getElementById('preview-'+id).textContent=e.target.value;};
function fallbackCopy(rich,plain){const listener=e=>{e.preventDefault();e.clipboardData.setData('text/html',rich);e.clipboardData.setData('text/plain',plain);};document.addEventListener('copy',listener);let ok=false;try{ok=document.execCommand('copy');}finally{document.removeEventListener('copy',listener);}if(!ok)throw new Error('clipboard unavailable');}
const jpegCache=new Map();async function jpeg(src){if(jpegCache.has(src))return jpegCache.get(src);const promise=(async()=>{const img=new Image();img.src=src;await img.decode();const scale=Math.min(1,1080/img.naturalWidth),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85);})();jpegCache.set(src,promise);try{return await promise;}catch(e){jpegCache.delete(src);throw e;}}
async function clipboardHTML(){const clone=document.createElement('section');clone.style.cssText=textStyle(themes[ti])+'padding:0 16px;';clone.innerHTML=render(C.articles[ai],themes[ti],options());for(const img of clone.querySelectorAll('img'))if(!img.hasAttribute('data-chapter-number'))img.src=await jpeg(img.src);for(const e of clone.querySelectorAll('*'))for(const attr of [...e.attributes])if(attr.name==='class'||attr.name==='id'||attr.name.startsWith('data-'))e.removeAttribute(attr.name);return clone.outerHTML;}
document.getElementById('copy-body').onclick=async()=>{status.textContent='正在准备正文和配图…';try{const promise=clipboardHTML(),plain=body.innerText;if(navigator.clipboard?.write&&typeof ClipboardItem==='function'){try{await navigator.clipboard.write([new ClipboardItem({'text/html':promise.then(h=>new Blob([h],{type:'text/html'})),'text/plain':new Blob([plain],{type:'text/plain'})})]);}catch{fallbackCopy(await promise,plain);}}else fallbackCopy(await promise,plain);status.textContent='已复制正文和配图，请粘贴到公众号正文编辑区。';}catch(e){status.textContent='复制未成功，请用 Chrome 或 Edge 打开本页后重试。';}};
async function copyField(text,label){if(!String(text).trim()){status.textContent=label+'为空，请填写后再复制。';return;}try{if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);}catch{fallbackCopy(esc(text),text);}}else fallbackCopy(esc(text),text);status.textContent=label+'已复制。';}catch{status.textContent=label+'复制未成功，请直接选中文字复制。';}}
for(const id of ['title','author','digest'])document.getElementById('copy-'+id).onclick=()=>copyField(C.articles[ai][id]||'',{title:'标题',author:'作者',digest:'摘要'}[id]);
document.getElementById('export-body').onclick=async()=>{try{const a=C.articles[ai],t=themes[ti],rich=await clipboardHTML(),file='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(a.title)+'</title></head><body style="max-width:375px;margin:0 auto;padding:12px;">'+rich+'</body></html>',url=URL.createObjectURL(new Blob([file],{type:'text/html;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=a.title+'-'+t.name+'-正文.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='已生成排版正文下载。';}catch{status.textContent='下载未成功，请检查文稿图片后重试。';}};
document.getElementById('preview-mode').onchange=e=>{previewMode=e.target.value;apply();};for(const id of ['rhythm','framing'])document.getElementById(id).onchange=apply;
populate();apply();
</script></body></html>
